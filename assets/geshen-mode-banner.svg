<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">割神模式</title>
  <desc id="desc">深色金融终端风格的割神模式项目横幅</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset=".55" stop-color="#070A12"/>
      <stop offset="1" stop-color="#1A0F00"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".18" r=".7">
      <stop stop-color="#FFB000" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFE7A3"/>
      <stop offset=".55" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="40" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="40" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="40" fill="url(#grid)"/>
  <g opacity=".22" stroke="#FFB000" fill="none">
    <path d="M0 500C180 430 300 545 470 470S780 330 960 380s220-30 320-90" stroke-width="3"/>
    <path d="M0 542C190 500 330 575 520 515s300-150 500-88 180-20 260-70" stroke-width="1.5"/>
  </g>
  <g transform="translate(86 82)">
    <rect width="188" height="42" rx="21" fill="#FFB000" fill-opacity=".12" stroke="#FFB000" stroke-opacity=".55"/>
    <text x="94" y="28" text-anchor="middle" fill="#FFE7A3" font-size="16" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="2">VERSION 0.2.0</text>
    <text y="150" fill="#F8FAFC" font-size="86" font-weight="900" font-family="system-ui, PingFang SC, sans-serif">割神模式</text>
    <text y="215" fill="url(#gold)" font-size="34" font-weight="800" font-family="system-ui, PingFang SC, sans-serif">三分割味，七分真东西。</text>
    <text y="286" fill="#CBD5E1" font-size="23" font-family="system-ui, PingFang SC, sans-serif">先查事实，再收注意力。笑话可以上杠杆，证据不行。</text>
    <g transform="translate(0 348)" font-family="system-ui, PingFang SC, sans-serif">
      <rect width="190" height="54" rx="14" fill="#F8FAFC" fill-opacity=".07" stroke="#F8FAFC" stroke-opacity=".14"/>
      <text x="95" y="35" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="650">事实核 · 不瞎编</text>
      <rect x="208" width="210" height="54" rx="14" fill="#F8FAFC" fill-opacity=".07" stroke="#F8FAFC" stroke-opacity=".14"/>
      <text x="313" y="35" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="650">割神核 · 有模型</text>
      <rect x="436" width="230" height="54" rx="14" fill="#F8FAFC" fill-opacity=".07" stroke="#F8FAFC" stroke-opacity=".14"/>
      <text x="551" y="35" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="650">喜剧核 · 有分寸</text>
    </g>
  </g>
  <g transform="translate(930 120)" filter="url(#shadow)">
    <circle cx="120" cy="120" r="116" fill="#FFB000" fill-opacity=".08" stroke="#FFB000" stroke-opacity=".4"/>
    <circle cx="120" cy="120" r="76" fill="url(#gold)"/>
    <text x="120" y="145" text-anchor="middle" fill="#111827" font-size="76" font-weight="900" font-family="system-ui, PingFang SC, sans-serif">割</text>
    <path d="M22 260c62 82 182 79 243 0-57 25-133 11-178-36-18-19-43-3-65 36Z" fill="#FFE7A3" stroke="#FFB000" stroke-width="6"/>
    <path d="m215 35 25-17-7 30 23 15-31 2-11 28-7-29-30-7 26-13Z" fill="#F8FAFC"/>
  </g>
  <text x="1194" y="586" text-anchor="end" fill="#64748B" font-size="16" font-family="ui-monospace, monospace">ATTENTION / NARRATIVE / ACTION</text>
</svg>
